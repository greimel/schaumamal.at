name: Deploy landing page

# Interim: publishes site/ (the landing page, CNAME, .nojekyll) to gh-pages,
# so GitHub Pages and the custom domain can be wired before the charts move
# in. Replaced by deploy.yml (the Julia build) once the content is committed.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean: true
          single-commit: true
